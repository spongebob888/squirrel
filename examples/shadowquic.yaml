# Replace the server, credentials, and server-name before connecting.
# Standard ShadowQUIC configs also work: Squirrel adds a TUN if absent.
inbounds:
  - type: tun
    tag: vpn
    ipv4: 172.19.0.1/30
    ipv6: fdfe:dcba:9876::1/126
    mtu: 1400
outbounds:
  - type: shadowquic
    tag: proxy
    addr: "YOUR_SERVER:443"
    username: "YOUR_USERNAME"
    password: "YOUR_PASSWORD"
    server-name: "YOUR_TLS_SERVER_NAME"
    alpn: [h3]
    congestion-control: bbr
    zero-rtt: true
    over-stream: false
router:
  default-outbound: proxy
android:
  # These DNS requests travel through the VPN's selected outbound.
  dns-servers: [1.1.1.1, 1.0.0.1]
log-level: info
