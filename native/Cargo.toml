[package]
name = "squirrel-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "squirrel"
crate-type = ["cdylib", "rlib"]

[dependencies]
shadowquic = { path = "../.build/shadowquic/shadowquic", default-features = false, features = [
    "shadowquic-quinn",
    "sunnyquic-noq",
    "ring",
    "statistics",
    "tproxy",
    "mixed",
    "plugin-vendored",
    "router-db",
    "dns-server",
    "router-dhcp-lease",
    "tun",
    "restful-api",
] }

jni = "0.21.1"
serde_json = "1"
serde-saphyr = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
shadowquic = { path = "../.build/shadowquic/shadowquic", features = ["jemalloc"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "unwind"
