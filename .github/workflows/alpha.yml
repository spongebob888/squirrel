name: Alpha release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Keep every push: do not cancel earlier builds when main advances.
jobs:
  alpha:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Resolve pinned ShadowQUIC dependency
        run: |
          shadowquic_dir="$(nix develop ./nix --command python3 scripts/prepare-core.py)"
          echo "SHADOWQUIC_REVISION=$(git -C "$shadowquic_dir" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check Rust formatting and tests
        run: |
          nix develop ./nix --command cargo fmt --manifest-path native/Cargo.toml -- --check
          nix develop ./nix --command cargo test --manifest-path native/Cargo.toml --locked

      - name: Build and lint Android
        env:
          SQUIRREL_VERSION_CODE: ${{ github.run_number }}
          SQUIRREL_VERSION_NAME: 0.1.0-alpha.${{ github.run_number }}.${{ github.run_attempt }}
        run: nix develop ./nix --command ./gradlew --no-daemon assembleRelease lintRelease

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: nix develop ./nix --command bash scripts/sign-release.sh

      - name: Package alpha
        env:
          ALPHA_TAG: alpha-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/squirrel-$ALPHA_TAG.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          cat > dist/notes.md <<EOF_NOTES
          Automated alpha build from main.

          - Squirrel commit: $GITHUB_SHA
          - ShadowQUIC v0.4.5 commit: $SHADOWQUIC_REVISION
          - Universal APK: ARM64 and x86_64; Android 8.0 or later.
          - Release APK signed with the persistent repository signing key.
            Subsequent alphas signed with this key can update the app in place.
            Switching from a debug-signed build requires uninstalling it first;
            export configurations before doing so.
          - Rust tests, formatting, Android build and lint passed.
            Device instrumentation tests are not run by this workflow.
          EOF_NOTES

      - name: Publish alpha prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALPHA_TAG: alpha-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$ALPHA_TAG" \
            --target "$GITHUB_SHA" \
            --title "Squirrel $ALPHA_TAG" \
            --prerelease --latest=false \
            --notes-file dist/notes.md \
            "dist/squirrel-$ALPHA_TAG.apk" dist/SHA256SUMS
