name: Android releases

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

# Share the run-number/version-code sequence across alpha and tagged releases.
# Keep every push: do not cancel earlier builds when main advances.
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag="$GITHUB_REF_NAME"
            version_name="${release_tag#v}"
            version_name="${version_name:-$release_tag}"
          else
            release_tag="alpha-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
            version_name="0.1.0-alpha.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          {
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_ASSET=squirrel-${release_tag//\//-}.apk"
            echo "SQUIRREL_VERSION_NAME=$version_name"
            echo "SQUIRREL_VERSION_CODE=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Resolve pinned ShadowQUIC dependency
        run: |
          shadowquic_dir="$(nix develop ./nix --command python3 scripts/prepare-core.py)"
          echo "SHADOWQUIC_REVISION=$(git -C "$shadowquic_dir" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check Rust formatting and tests
        run: |
          nix develop ./nix --command cargo fmt --manifest-path native/Cargo.toml -- --check
          nix develop ./nix --command cargo test --manifest-path native/Cargo.toml --locked

      - name: Build and lint Android
        run: nix develop ./nix --command ./gradlew --no-daemon assembleRelease lintRelease

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: nix develop ./nix --command bash scripts/sign-release.sh

      - name: Package release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$RELEASE_ASSET"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          cat > dist/notes.md <<EOF_NOTES
          Automated Squirrel $SQUIRREL_VERSION_NAME build from $GITHUB_REF.

          - Squirrel commit: $GITHUB_SHA
          - ShadowQUIC v0.4.5 commit: $SHADOWQUIC_REVISION
          - Universal APK: ARM64 and x86_64; Android 8.0 or later.
          - Release APK signed with the persistent repository signing key.
            Subsequent builds signed with this key can update the app in place.
            Switching from a debug-signed build requires uninstalling it first;
            export configurations before doing so.
          - Rust tests, formatting, Android build and lint passed.
            Device instrumentation tests are not run by this workflow.
          EOF_NOTES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_flags=(--verify-tag)
          else
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Squirrel $RELEASE_TAG" \
            "${release_flags[@]}" \
            --notes-file dist/notes.md \
            "dist/$RELEASE_ASSET" dist/SHA256SUMS
